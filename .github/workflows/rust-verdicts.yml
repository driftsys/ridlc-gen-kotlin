# The Rust codec verdicts (#39): `just rust-verdicts` regenerates every file
# the conformance module compares with the Rust codec of the pinned ridl
# release, and fails when one differs from the committed file. It runs when
# something that can change those files changes: the pin, the conformance
# tests and their corpus, the plugin and the runtime, whose generated codec
# encodes the corpus the Rust programs read, the build files and the version
# catalog, whose dependency bumps can change the generated output, or the
# regeneration itself (#53).
name: rust-verdicts

on:
  push:
    branches: [main]
    paths:
      - modules/conformance/ridl-release
      - modules/conformance/src/test/**
      - modules/ridlc-gen-kotlin/src/main/**
      - modules/ridl-rt-kt/src/main/**
      - "**/build.gradle.kts"
      - settings.gradle.kts
      - gradle/libs.versions.toml
      - scripts/rust-verdicts.py
      - justfile
      - .github/workflows/rust-verdicts.yml
  pull_request:
    paths:
      - modules/conformance/ridl-release
      - modules/conformance/src/test/**
      - modules/ridlc-gen-kotlin/src/main/**
      - modules/ridl-rt-kt/src/main/**
      - "**/build.gradle.kts"
      - settings.gradle.kts
      - gradle/libs.versions.toml
      - scripts/rust-verdicts.py
      - justfile
      - .github/workflows/rust-verdicts.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-verdicts-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned by commit, each to the release its `v4` tag named when
# pinned; the `just` tarball is checked against its published SHA-256.
env:
  JUST_VERSION: 1.38.0
  JUST_SHA256: c803e67fd7b0af01667bd537197bc3df319938eacf9e8d51a441c71d03035bb5

jobs:
  rust-verdicts:
    name: rust-verdicts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - name: install just
        run: |
          tarball="just-${JUST_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$tarball" "https://github.com/casey/just/releases/download/${JUST_VERSION}/$tarball"
          echo "${JUST_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum --check --strict
          mkdir -p "$HOME/.local/bin"
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$HOME/.local/bin" just
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: update the Rust toolchain
        run: rustup update stable --no-self-update && rustup default stable
      # The crates.io registry and the round-trip programs' target directory.
      # A new pin or a new script saves a new entry, starting from the last one.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            modules/conformance/build/rust-verdicts/target
          key: rust-verdicts-${{ hashFiles('modules/conformance/ridl-release', 'scripts/rust-verdicts.py') }}
          restore-keys: rust-verdicts-
      - run: just rust-verdicts
