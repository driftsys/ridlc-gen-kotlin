# The repository gate (docs/design.md §6, stage K0): the JVM job runs every
# check the Gradle `check` task holds, beside the root formatting and
# repository checks; commit-lint lints the PR's own commits; snapshot
# publishes the libraries from main once the jvm job passes.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JUST_VERSION: 1.38.0

jobs:
  jvm:
    name: jvm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: install just
        run: |
          set -o pipefail
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://github.com/casey/just/releases/download/${JUST_VERSION}/just-${JUST_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            | tar -xz -C "$HOME/.local/bin" just
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: install prim
        run: |
          set -o pipefail
          curl -fsSL https://raw.githubusercontent.com/driftsys/prim/main/install.sh | bash \
            || cargo install --git https://github.com/driftsys/prim --locked
          command -v prim
        env:
          PRIM_INSTALL_DIR: /usr/local/bin
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: just build
      # The conformance results as the release packs them, kept with the run.
      - run: just compliance
      - uses: actions/upload-artifact@v4
        with:
          name: compliance
          path: build/compliance/*.tar.gz
          if-no-files-found: error

  commit-lint:
    name: commit-lint
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # The default pull_request checkout is a synthetic merge commit,
          # which can never pass a conventional-commit lint.
          ref: ${{ github.event.pull_request.head.sha }}
      - name: install just
        run: |
          set -o pipefail
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://github.com/casey/just/releases/download/${JUST_VERSION}/just-${JUST_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            | tar -xz -C "$HOME/.local/bin" just
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: install git-std
        run: |
          set -o pipefail
          curl -fsSL https://raw.githubusercontent.com/driftsys/git-std/main/install.sh | bash \
            || cargo install --git https://github.com/driftsys/git-std git-std --locked
          command -v git-std
        env:
          GIT_STD_INSTALL_DIR: /usr/local/bin
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: just lint-commits ${{ github.base_ref }}

  # Each push to main that passes the jvm job publishes the four JVM libraries,
  # `ridl-rt-kt-conformance` among them, to GitHub Packages at the -SNAPSHOT
  # version gradle.properties names, so a runtime in another repository can
  # build against main with no `just publish-local`. A release version is
  # published by the release workflow from its tag instead, and skipped here.
  snapshot:
    name: snapshot
    needs: jvm
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: check for a snapshot version
        id: version
        run: |
          version="$(sed -n 's/^version=//p' gradle.properties)"
          case "$version" in
            *-SNAPSHOT) echo "snapshot=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "snapshot=false" >> "$GITHUB_OUTPUT"; echo "$version is a release version: the release workflow publishes it" ;;
          esac
      - uses: actions/setup-java@v4
        if: steps.version.outputs.snapshot == 'true'
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        if: steps.version.outputs.snapshot == 'true'
      - name: install just
        if: steps.version.outputs.snapshot == 'true'
        run: |
          set -o pipefail
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://github.com/casey/just/releases/download/${JUST_VERSION}/just-${JUST_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            | tar -xz -C "$HOME/.local/bin" just
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: just publish
        if: steps.version.outputs.snapshot == 'true'
        env:
          ORG_GRADLE_PROJECT_GitHubPackagesUsername: ${{ github.actor }}
          ORG_GRADLE_PROJECT_GitHubPackagesPassword: ${{ secrets.GITHUB_TOKEN }}
