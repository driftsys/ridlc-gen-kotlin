# The release: a `v<version>` tag, pushed after the `chore(release): <version>`
# commit (CONTRIBUTING.md, "Releasing"), runs the whole gate and the Rust codec
# verdicts on the tagged commit, then publishes:
#
# - the four JVM libraries, `ridl-rt-kt-conformance` among them, to GitHub
#   Packages (`just publish`);
# - the plugin distribution, `.zip` and `.tar` (`just dist`, docs/design.md §2),
#   and `install.sh`, which installs it;
# - the runtime sources as an Android tree vendors them, with an Android.bp
#   (`just vendor-package`, packaging/android/README.md);
# - the conformance results (`just compliance`);
# - the book, docs/book, to GitHub Pages (the `pages` job).
#
# The distribution, the installer, the Android package and the conformance
# results are assets of a GitHub release named after the tag, with a
# SHA256SUMS file over them, and the release notes are the tag's section of
# CHANGELOG.md. The installer is run on the assets before anything is
# published.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Actions are pinned by commit, each to the release its `v4` tag named when
# pinned; the `just` tarball is checked against its published SHA-256.
env:
  JUST_VERSION: 1.38.0
  JUST_SHA256: c803e67fd7b0af01667bd537197bc3df319938eacf9e8d51a441c71d03035bb5
  MDBOOK_VERSION: 0.4.40
  MDBOOK_SHA256: 9ef07fd288ba58ff3b99d1c94e6d414d431c9a61fdb20348e5beb74b823d546b

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The whole history, so the tagged commit can be checked against main.
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          # A release builds from nothing a pull request could have written.
          cache-read-only: true
      - name: install just
        run: |
          tarball="just-${JUST_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$tarball" "https://github.com/casey/just/releases/download/${JUST_VERSION}/$tarball"
          echo "${JUST_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum --check --strict
          mkdir -p "$HOME/.local/bin"
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$HOME/.local/bin" just
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: install prim
        run: |
          set -o pipefail
          curl -fsSL https://raw.githubusercontent.com/driftsys/prim/main/install.sh | bash \
            || cargo install --git https://github.com/driftsys/prim --locked
          command -v prim
        env:
          PRIM_INSTALL_DIR: /usr/local/bin
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: update the Rust toolchain
        run: rustup update stable --no-self-update && rustup default stable
      - name: check the tag against gradle.properties
        run: |
          version="$(sed -n 's/^version=//p' gradle.properties)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match version $version in gradle.properties" >&2
            exit 1
          fi
          case "$version" in
            *-SNAPSHOT) echo "a release version carries no -SNAPSHOT: $version" >&2; exit 1 ;;
          esac
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: check that the tagged commit is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "$GITHUB_REF_NAME ($GITHUB_SHA) is not on main: a release is tagged on main" >&2
            exit 1
          fi
      - run: just build
      - run: just rust-verdicts
      - run: just dist
      - run: just compliance
      - run: just vendor-package
      - name: stage the release assets
        run: |
          stage="$RUNNER_TEMP/release/$GITHUB_REF_NAME"
          mkdir -p "$stage"
          cp modules/ridlc-gen-kotlin/build/distributions/*.zip \
             modules/ridlc-gen-kotlin/build/distributions/*.tar \
             build/compliance/*.tar.gz \
             build/vendor/*.tar.gz "$stage"/
          # The installer this release carries installs this release.
          sed 's/^RELEASE_VERSION=""$/RELEASE_VERSION="'"$GITHUB_REF_NAME"'"/' install.sh > "$stage/install.sh"
          grep -qx "RELEASE_VERSION=\"$GITHUB_REF_NAME\"" "$stage/install.sh"
          # One SHA-256 per asset, which the installer checks its download against.
          (cd "$stage" && sha256sum -- * > "$RUNNER_TEMP/SHA256SUMS" && mv "$RUNNER_TEMP/SHA256SUMS" .)
          echo "STAGE=$stage" >> "$GITHUB_ENV"
      # The staged installer, run against the staged assets, before anything
      # is published: the distribution's name and layout are what it expects.
      - name: check the installer on the release assets
        run: |
          RIDLC_GEN_KOTLIN_BASE_URL="file://$RUNNER_TEMP/release" \
            RIDLC_GEN_KOTLIN_HOME="$RUNNER_TEMP/home" RIDLC_GEN_KOTLIN_INSTALL_DIR="$RUNNER_TEMP/bin" \
            bash "$STAGE/install.sh"
          test -f "$RUNNER_TEMP/home/$GITHUB_REF_NAME/lib/ridlc-gen-kotlin-all.jar"
          test -x "$RUNNER_TEMP/bin/ridlc-gen-kotlin"
      # The release is created as a draft first, so a failure in it comes
      # before the libraries are published: GitHub Packages refuses a version
      # twice, so a run that failed after publishing could not be run again.
      - name: create the GitHub release as a draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A draft left by an earlier failed run of this tag is replaced.
          if [ "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft 2>/dev/null)" = "true" ]; then
            gh release delete "$GITHUB_REF_NAME" --yes
          fi
          # The tag's section of CHANGELOG.md: from the heading that names the
          # version, as a whole word, to the next heading.
          notes="$RUNNER_TEMP/notes.md"
          if [ -f CHANGELOG.md ]; then
            awk -v v="$VERSION" '
              BEGIN { gsub(/\./, "\\.", v); pattern = "(^|[^0-9.])" v "([^0-9.]|$)" }
              /^## / { if (found) exit; if ($0 ~ pattern) { found = 1; next } }
              found { print }
            ' CHANGELOG.md > "$notes"
          fi
          if [ -s "$notes" ]; then
            set -- --notes-file "$notes"
          else
            set -- --generate-notes
          fi
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "$GITHUB_REF_NAME" "$@" "$STAGE"/*
      - run: just publish
        env:
          ORG_GRADLE_PROJECT_GitHubPackagesUsername: ${{ github.actor }}
          ORG_GRADLE_PROJECT_GitHubPackagesPassword: ${{ secrets.GITHUB_TOKEN }}
      - name: publish the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false

  # The book (docs/book) at the released commit, published to GitHub Pages
  # once the release is out, so the site always describes the latest release.
  # The repository's Pages source is GitHub Actions, and the github-pages
  # environment must allow deployments from `v*` tags.
  pages:
    name: pages
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: install just
        run: |
          tarball="just-${JUST_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$tarball" "https://github.com/casey/just/releases/download/${JUST_VERSION}/$tarball"
          echo "${JUST_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum --check --strict
          mkdir -p "$HOME/.local/bin"
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$HOME/.local/bin" just
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: install mdbook
        run: |
          tarball="mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$tarball" "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/$tarball"
          echo "${MDBOOK_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum --check --strict
          mkdir -p "$HOME/.local/bin"
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: just book-check
      - run: just book-build
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: book
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
